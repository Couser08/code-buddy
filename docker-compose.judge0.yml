# ==============================================================================
# JUDGE0 COMMUNITY EDITION (CE) - 100% FREE SELF-HOSTED DOCKER COMPOSE
# Deploy on: Any VPS (Hetzner, DigitalOcean, Oracle Cloud Free Tier) or Local PC
# To run: docker compose -f docker-compose.judge0.yml up -d
# ==============================================================================

version: '3.8'

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=YourSecurePassword123
    depends_on:
      - db
      - redis

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=YourSecurePassword123
    depends_on:
      - db
      - redis

  db:
    image: postgres:13.0
    restart: always
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=YourSecurePassword123
    volumes:
      - judge0-db-data:/var/lib/postgresql/data

  redis:
    image: redis:6.0
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - judge0-redis-data:/data

volumes:
  judge0-db-data:
  judge0-redis-data:
